<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>重来人生</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#090b12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="x5-fullscreen" content="true">
    <meta name="360-fullscreen" content="true">
    <link rel="stylesheet" href="./style.css">
    <link rel="preload" href="./cocos-js/cc.js" as="script" crossorigin>
    <link rel="preload" href="./assets/main/index.js" as="script" crossorigin>
  </head>
  <body>
    <div id="boot-screen" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-mark">重</div>
        <div class="boot-title">重来人生</div>
        <div id="boot-message" class="boot-message">正在载入人生档案…</div>
        <div class="boot-track"><span></span></div>
        <button id="boot-retry" type="button" hidden>重新加载</button>
      </div>
    </div>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <div id="GameDiv" cc_exact_fit_screen="false">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="720" tabindex="0"></canvas>
      </div>
    </div>
    <script>
      (function () {
        var screen = document.getElementById('boot-screen');
        var message = document.getElementById('boot-message');
        var retry = document.getElementById('boot-retry');
        var finished = false;
        performance.mark('life-boot-start');
        function readInsets() {
          var style = getComputedStyle(document.getElementById('safe-area-probe'));
          window.__restartLifeInsets = { top: parseFloat(style.paddingTop) || 0, bottom: parseFloat(style.paddingBottom) || 0 };
        }
        readInsets();
        window.addEventListener('resize', readInsets);
        window.__restartLifeReady = function () {
          if (finished) return;
          finished = true;
          performance.mark('life-interactive');
          performance.measure('life-startup', 'life-boot-start', 'life-interactive');
          screen.classList.add('is-ready');
          window.setTimeout(function () { screen.remove(); }, 260);
        };
        window.__restartLifeFailed = function (error) {
          if (finished) return;
          message.textContent = '加载失败，请检查网络后重试';
          retry.hidden = false;
          screen.classList.add('has-error');
          console.error(error);
        };
        retry.addEventListener('click', function () { location.reload(); });
        window.addEventListener('error', function (event) { window.__restartLifeFailed(event.error || event.message); });
        window.addEventListener('unhandledrejection', function (event) { window.__restartLifeFailed(event.reason); });
        window.setTimeout(function () { if (!finished) message.textContent = '首次进入正在准备游戏引擎…'; }, 2500);
        window.setTimeout(function () { if (!finished) message.textContent = '网络较慢，仍在加载，请稍候…'; }, 7000);
      })();
    </script>
    <script src="./src/polyfills.bundle.js" charset="utf-8"></script>
    <script src="./src/system.bundle.js" charset="utf-8"></script>
    <script src="./src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
    <script>
      System.import('./index.js').catch(function (error) { window.__restartLifeFailed(error); });
    </script>
  </body>
</html>
